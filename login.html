<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · Work on Pan</title>
  <meta name="description" content="Entra na tua conta Work on Pan para gerir projetos, propostas e mensagens.">
  <link rel="icon" href="pan.png">
  <link rel="stylesheet" href="styles.css">
  <script>try{var t=localStorage.getItem("wop_tema");if(t==="claro")document.documentElement.dataset.theme="light";if(t==="escuro")document.documentElement.dataset.theme="dark"}catch(e){}</script>
</head>
<body>
  <header id="topo" class="topo"></header>

  <main>
    <div class="entrada">
      <div class="entrada-cabecalho">
        <img src="pan.png" alt="">
        <h1>Entrar</h1>
        <p class="texto-suave">Usa o e-mail com que criaste a conta. Vais para o teu painel:
          clientes veem os seus projetos, freelancers veem as suas propostas.</p>
      </div>

      <form class="cartao" id="formEntrar" novalidate>
        <div id="mensagem" class="mensagem-form" role="alert" hidden></div>

        <div class="campo">
          <label for="email">E-mail</label>
          <input type="email" id="email" autocomplete="email" required>
        </div>

        <div class="campo">
          <label for="senha">Palavra-passe</label>
          <input type="password" id="senha" autocomplete="current-password" required>
        </div>

        <button type="submit" class="botao botao-principal botao-largo" id="btnEntrar">Entrar na minha conta</button>

        <p class="texto-pequeno" style="margin: 14px 0 0">
          <button type="button" class="botao-texto" id="btnRecuperar">Esqueci-me da palavra-passe</button>
          — enviamos um link para o e-mail acima.
        </p>
      </form>

      <p class="texto-suave" style="text-align: center; margin-top: 18px">
        Ainda não tens conta? <a href="cadastro.html">Cria uma conta de cliente ou freelancer</a>.
      </p>
    </div>
  </main>

  <footer id="rodape" class="rodape"></footer>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
  <script>
    const destino = (() => {
      const v = new URLSearchParams(location.search).get("volta") || "";
      // Só aceita páginas do próprio site.
      return /^[a-z-]+\.html(\?[\w=&%-]*)?$/.test(v) ? v : "index.html";
    })();

    function mostrar(texto, tipo = "erro") {
      const m = $("mensagem");
      m.textContent = texto;
      m.className = "mensagem-form " + tipo;
      m.hidden = false;
    }

    $("formEntrar").addEventListener("submit", (ev) => {
      ev.preventDefault();
      const email = $("email").value.trim();
      const senha = $("senha").value;
      if (!email || !senha) return mostrar("Escreve o e-mail e a palavra-passe.");

      const btn = $("btnEntrar");
      btn.disabled = true;
      btn.textContent = "A entrar…";
      auth
        .signInWithEmailAndPassword(email, senha)
        .then(() => (location.href = destino))
        .catch((e) => {
          mostrar(traduzirErro(e));
          btn.disabled = false;
          btn.textContent = "Entrar na minha conta";
        });
    });

    $("btnRecuperar").addEventListener("click", () => {
      const email = $("email").value.trim();
      if (!email) return mostrar("Escreve primeiro o teu e-mail no campo acima.");
      auth
        .sendPasswordResetEmail(email)
        .then(() => mostrar(`Se existir uma conta com ${email}, vais receber um e-mail com o link para criar uma nova palavra-passe.`, "ok"))
        .catch((e) => mostrar(traduzirErro(e)));
    });

    sessaoOpcional((user) => {
      if (user) location.href = destino;
    });
  </script>
</body>
</html>
