<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projetos abertos · Work on Pan</title>
  <meta name="description" content="Projetos publicados por clientes que estão a receber propostas de freelancers.">
  <link rel="icon" href="pan.png">
  <link rel="stylesheet" href="styles.css">
  <script>try{var t=localStorage.getItem("wop_tema");if(t==="claro")document.documentElement.dataset.theme="light";if(t==="escuro")document.documentElement.dataset.theme="dark"}catch(e){}</script>
</head>
<body>
  <header id="topo" class="topo"></header>

  <main>
    <div class="cabecalho-pagina">
      <h1>Projetos abertos</h1>
      <p id="introducao">Trabalhos publicados por clientes que ainda estão a escolher freelancer.
        Abre um projeto para ler os detalhes e enviar a tua proposta.</p>
    </div>

    <form class="filtros" role="search" onsubmit="return false">
      <div class="campo">
        <label for="pesquisa">Procurar</label>
        <input type="search" id="pesquisa" placeholder="Palavra no título, descrição ou competência">
      </div>
      <div class="campo">
        <label for="filtroCategoria">Área</label>
        <select id="filtroCategoria"></select>
      </div>
      <div class="campo">
        <label for="filtroOrcamento">Orçamento</label>
        <select id="filtroOrcamento">
          <option value="">Qualquer valor</option>
          <option value="0-500">Até 500</option>
          <option value="500-2000">500 a 2 000</option>
          <option value="2000-">Mais de 2 000</option>
        </select>
      </div>
      <div class="campo">
        <label for="ordem">Ordenar</label>
        <select id="ordem">
          <option value="recentes">Mais recentes</option>
          <option value="maior">Maior orçamento</option>
          <option value="prazo">Prazo mais curto</option>
        </select>
      </div>
    </form>

    <p id="contagem" class="texto-suave texto-pequeno" aria-live="polite">A carregar projetos…</p>
    <div id="listaProjetos" class="lista-cartoes duas-colunas"></div>
  </main>

  <dialog id="janelaProjeto" aria-labelledby="jpTitulo">
    <div class="dialog-corpo">
      <div class="dialog-cabecalho">
        <div>
          <p class="texto-suave texto-pequeno" id="jpCategoria" style="margin: 0 0 4px"></p>
          <h2 id="jpTitulo" style="margin: 0"></h2>
        </div>
        <button type="button" class="fechar" onclick="$('janelaProjeto').close()">Fechar</button>
      </div>
      <ul class="meta" id="jpMeta"></ul>
      <p id="jpDescricao" style="white-space: pre-line; margin-top: 14px"></p>
      <ul class="competencias" id="jpCompetencias"></ul>

      <hr style="border: 0; border-top: 1px solid var(--linha); margin: 20px 0">
      <div id="jpAcao"></div>
    </div>
  </dialog>

  <footer id="rodape" class="rodape"></footer>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
  <script>
    let projetos = [];
    let minhasPropostas = {}; // projetoId → proposta (só para freelancers com sessão)
    let projetoAberto = null;

    $("filtroCategoria").innerHTML =
      '<option value="">Todas as áreas</option>' +
      Object.entries(CATEGORIAS).map(([k, v]) => `<option value="${k}">${esc(v)}</option>`).join("");

    const categoriaUrl = new URLSearchParams(location.search).get("area");
    if (categoriaUrl && CATEGORIAS[categoriaUrl]) $("filtroCategoria").value = categoriaUrl;

    ["pesquisa", "filtroCategoria", "filtroOrcamento", "ordem"].forEach((id) =>
      $(id).addEventListener("input", desenhar)
    );

    function orcamentoDe(p) {
      return p.orcamento ?? p.budget ?? null;
    }

    function desenhar() {
      const termo = $("pesquisa").value.trim().toLowerCase();
      const cat = $("filtroCategoria").value;
      const [min, max] = ($("filtroOrcamento").value || "-").split("-").map((n) => (n ? Number(n) : null));

      let lista = projetos.filter((p) => {
        const texto = [p.titulo, p.descricao, ...(p.competencias || [])].join(" ").toLowerCase();
        const valor = orcamentoDe(p) ?? 0;
        return (
          (!termo || texto.includes(termo)) &&
          (!cat || p.categoria === cat) &&
          (min === null || valor >= min) &&
          (max === null || valor <= max)
        );
      });

      const ordem = $("ordem").value;
      if (ordem === "maior") lista.sort((a, b) => (orcamentoDe(b) || 0) - (orcamentoDe(a) || 0));
      else if (ordem === "prazo") lista.sort((a, b) => (a.prazoDias || 999) - (b.prazoDias || 999));
      else ordenarPorData(lista);

      $("contagem").textContent = projetos.length
        ? `${lista.length} de ${projetos.length} projeto${projetos.length === 1 ? "" : "s"} aberto${projetos.length === 1 ? "" : "s"}`
        : "";

      if (!projetos.length) {
        $("listaProjetos").innerHTML = `
          <div class="cartao vazio" style="grid-column: 1 / -1">
            <h2>Ainda não há projetos abertos</h2>
            <p>Quando um cliente publicar um trabalho, aparece aqui. Se precisas de alguém para um trabalho,
              podes ser o primeiro a publicar.</p>
            <a class="botao botao-principal" href="${wopConta?.tipo === "cliente" ? "index.html#publicar" : "cadastro.html?tipo=cliente"}">Publicar um projeto</a>
          </div>`;
        return;
      }
      if (!lista.length) {
        $("listaProjetos").innerHTML = `
          <div class="cartao vazio" style="grid-column: 1 / -1">
            <p>Nenhum projeto corresponde a estes filtros.</p>
            <button class="botao botao-secundario" onclick="limparFiltros()">Limpar filtros</button>
          </div>`;
        return;
      }

      $("listaProjetos").innerHTML = lista.map((p) => {
        const minha = minhasPropostas[p.id];
        const botao = minha && minha.estado !== "retirada"
          ? `<span class="etiqueta etiqueta-ok">Já enviaste proposta</span>`
          : `<button class="botao botao-secundario botao-pequeno" onclick="abrirProjeto('${esc(p.id)}')">Ver detalhes${wopConta?.tipo === "freelancer" ? " e propor" : ""}</button>`;
        return `
          <article class="cartao">
            <div class="item-topo">
              <div>
                <p class="texto-suave texto-pequeno" style="margin: 0 0 2px">${esc(nomeCategoria(p.categoria))}</p>
                <h3><a href="#" onclick="abrirProjeto('${esc(p.id)}'); return false" style="color: inherit; text-decoration: none">${esc(p.titulo)}</a></h3>
              </div>
              <span class="valor">${esc(dinheiro(orcamentoDe(p), p.moeda))}</span>
            </div>
            <p class="item-descricao">${esc(p.descricao || p.desc)}</p>
            ${(p.competencias || []).length ? `<ul class="competencias">${p.competencias.map((c) => `<li>${esc(c)}</li>`).join("")}</ul>` : ""}
            <div class="item-rodape">
              <ul class="meta" style="margin: 0">
                <li>Entrega em ${esc(p.prazoDias || "?")} dias</li>
                <li>Publicado ${esc(dataCurta(p.createdAt))} por ${esc(p.clienteNome || "cliente")}</li>
              </ul>
              ${botao}
            </div>
          </article>`;
      }).join("");
    }

    function limparFiltros() {
      $("pesquisa").value = "";
      $("filtroCategoria").value = "";
      $("filtroOrcamento").value = "";
      desenhar();
    }

    function abrirProjeto(id) {
      const p = projetos.find((x) => x.id === id);
      if (!p) return;
      projetoAberto = p;
      $("jpCategoria").textContent = nomeCategoria(p.categoria);
      $("jpTitulo").textContent = p.titulo;
      $("jpDescricao").textContent = p.descricao || p.desc || "";
      $("jpMeta").innerHTML = `
        <li><strong>${esc(dinheiro(orcamentoDe(p), p.moeda))}</strong> de orçamento</li>
        <li>Entrega em ${esc(p.prazoDias || "?")} dias</li>
        <li>Cliente: ${esc(p.clienteNome || "—")}</li>
        <li>Publicado ${esc(dataCurta(p.createdAt))}</li>`;
      $("jpCompetencias").innerHTML = (p.competencias || []).map((c) => `<li>${esc(c)}</li>`).join("");
      desenharAcao();
      $("janelaProjeto").showModal();
    }

    // O que aparece no fundo da janela depende de quem está a ver.
    function desenharAcao() {
      const p = projetoAberto;
      const alvo = $("jpAcao");

      if (!wopConta) {
        alvo.innerHTML = `
          <p>Para enviar uma proposta precisas de uma conta de freelancer.</p>
          <div class="acoes">
            <a class="botao botao-principal" href="login.html?volta=projetos.html">Entrar</a>
            <a class="botao botao-secundario" href="cadastro.html?tipo=freelancer">Criar conta de freelancer</a>
          </div>`;
        return;
      }
      if (wopConta.tipo === "cliente") {
        alvo.innerHTML = p.clienteId === wopUser.uid
          ? `<p>Este projeto é teu. As propostas que receberes aparecem em <a href="index.html">Os meus projetos</a>.</p>`
          : `<p class="texto-suave">Estás com uma conta de cliente, por isso só podes ver este projeto. Só contas de freelancer enviam propostas.</p>`;
        return;
      }

      const minha = minhasPropostas[p.id];
      if (minha && minha.estado !== "retirada") {
        alvo.innerHTML = `
          <p>Já enviaste uma proposta de <strong>${esc(dinheiro(minha.valor, minha.moeda))}</strong> para este projeto.
            Estado: ${etiqueta(ESTADOS_PROPOSTA, minha.estado)}</p>
          <div class="acoes">
            <a class="botao botao-secundario" href="index.html">Ver as minhas propostas</a>
            ${minha.chatId ? `<a class="botao botao-secundario" href="chat.html?c=${encodeURIComponent(minha.chatId)}">Falar com o cliente</a>` : ""}
          </div>`;
        return;
      }

      alvo.innerHTML = `
        <h3>A tua proposta</h3>
        <p class="texto-suave texto-pequeno">Ao enviar, o cliente recebe a proposta no painel dele e abre-se uma conversa
          entre vocês em Mensagens. Podes editá-la ou retirá-la enquanto ele não responder.</p>
        <form id="formProposta" novalidate>
          <div id="msgProposta" class="mensagem-form erro" role="alert" hidden></div>
          <div class="linha-campos">
            <div class="campo">
              <label for="ppValor">Quanto cobras pelo trabalho todo?</label>
              <input type="number" id="ppValor" min="1" step="1" inputmode="numeric" required>
            </div>
            <div class="campo">
              <label for="ppMoeda">Moeda</label>
              <select id="ppMoeda">${Object.entries(MOEDAS).map(([k, v]) => `<option value="${k}" ${k === (p.moeda || "EUR") ? "selected" : ""}>${esc(v)}</option>`).join("")}</select>
            </div>
          </div>
          <div class="campo">
            <label for="ppPrazo">Em quantos dias entregas?</label>
            <input type="number" id="ppPrazo" min="1" step="1" inputmode="numeric" required>
            <span class="ajuda">O cliente pediu ${esc(p.prazoDias || "?")} dias.</span>
          </div>
          <div class="campo">
            <label for="ppMensagem">Mensagem para o cliente</label>
            <textarea id="ppMensagem" maxlength="3000" required
              placeholder="Diz como farias o trabalho, o que já fizeste de parecido e o que precisas que o cliente te envie."></textarea>
          </div>
          <button type="submit" class="botao botao-principal botao-largo" id="btnProposta">Enviar proposta ao cliente</button>
        </form>`;
      $("formProposta").addEventListener("submit", enviarProposta);
    }

    function enviarProposta(ev) {
      ev.preventDefault();
      const p = projetoAberto;
      const valor = Number($("ppValor").value);
      const prazo = Number($("ppPrazo").value);
      const mensagem = $("ppMensagem").value.trim();
      const erro = (t) => { $("msgProposta").textContent = t; $("msgProposta").hidden = false; };

      if (!valor || valor <= 0) return erro("Indica o valor da proposta.");
      if (!prazo || prazo <= 0) return erro("Indica em quantos dias entregas.");
      if (mensagem.length < 20) return erro("Escreve uma mensagem um pouco maior (pelo menos 20 caracteres) — é o que convence o cliente.");

      const btn = $("btnProposta");
      btn.disabled = true;
      btn.textContent = "A enviar…";

      const freelancerNome = nomeCompleto(wopPerfil);
      const propostaId = `${p.id}_${wopUser.uid}`;
      const moeda = $("ppMoeda").value;
      const anterior = minhasPropostas[p.id]; // proposta retirada que volta a ser enviada

      const chatId = `p_${p.id}_${wopUser.uid}`; // o mesmo id que garantirConversa usa
      const dados = { valor, moeda, prazoEntrega: prazo, mensagem, estado: "pendente", atualizadoEm: agora() };
      const ref = db.collection("propostas").doc(propostaId);
      const gravar = anterior
        ? ref.update(dados)
        : ref.set({
            ...dados,
            projetoId: p.id,
            projetoTitulo: p.titulo,
            clienteId: p.clienteId,
            freelancerId: wopUser.uid,
            freelancerNome,
            chatId,
            createdAt: agora(),
          });

      gravar
        .then(() => garantirConversa({
          clienteId: p.clienteId,
          clienteNome: p.clienteNome,
          freelancerId: wopUser.uid,
          freelancerNome,
          projetoId: p.id,
          projetoTitulo: p.titulo,
        }))
        .then(() => enviarMensagem(chatId,
          `${anterior ? "Voltei a enviar a proposta" : "Proposta"}: ${dinheiro(valor, moeda)}, entrega em ${prazo} dias.\n\n${mensagem}`))
        .then(() => {
          minhasPropostas[p.id] = { id: propostaId, valor, moeda, estado: "pendente", chatId };
          desenharAcao();
          desenhar();
          avisar("Proposta enviada. O cliente já a pode ver.");
        })
        .catch((e) => {
          console.error("[Work on Pan] proposta:", e);
          erro(e.code === "permission-denied"
            ? "Não foi possível enviar: o projeto pode já não estar a receber propostas."
            : traduzirErro(e));
          btn.disabled = false;
          btn.textContent = "Enviar proposta ao cliente";
        });
    }

    sessaoOpcional((user, conta) => {
      if (conta?.tipo === "cliente") {
        $("introducao").textContent =
          "É isto que os freelancers veem. Os teus projetos e as propostas recebidas estão em «Os meus projetos».";
      }

      // Sem orderBy para não precisar de índice composto; a ordenação faz-se aqui.
      db.collection("projetos")
        .where("estado", "==", "aberto")
        .onSnapshot(
          (snap) => {
            projetos = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
            desenhar();
          },
          (e) => {
            console.error("[Work on Pan] projetos:", e);
            $("contagem").textContent = "Não foi possível carregar os projetos. Recarrega a página.";
          }
        );

      if (conta?.tipo === "freelancer") {
        db.collection("propostas")
          .where("freelancerId", "==", user.uid)
          .onSnapshot((snap) => {
            minhasPropostas = {};
            snap.docs.forEach((d) => (minhasPropostas[d.data().projetoId] = { id: d.id, ...d.data() }));
            desenhar();
          });
      }
    });
  </script>
</body>
</html>
