<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Projetos abertos · Work on Pan</title>
  <meta name="description" content="Projetos publicados por clientes que estão a receber propostas de freelancers.">
  <meta name="theme-color" content="#f4f1ec" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141210" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preload" href="/fontes/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/componentes.css">
  <link rel="stylesheet" href="/css/paginas.css">
  <script src="/js/tema-inicial.js"></script>
  <script src="/vendor/supabase/supabase.js" defer></script>
  <script type="module" src="/js/paginas/projetos.js"></script>
  <script type="speculationrules">{"prefetch":[{"where":{"href_matches":"/*"},"eagerness":"moderate"}]}</script>
</head>
<body>
  <wop-topo></wop-topo>

  <main id="conteudo">
    <header class="cabecalho-pagina cabecalho-com-icone">
      <span class="titulo-icone"><wop-icone nome="projetos"></wop-icone></span>
      <h1>Projetos abertos</h1>
      <p id="introducao">Trabalhos publicados por clientes que ainda estão a escolher freelancer.
        Abre um projeto para ler os detalhes e enviar a tua proposta.</p>
    </header>

    <search class="caixa-filtros">
      <form class="filtros" id="filtros">
        <div class="campo">
          <label for="pesquisa">Procurar</label>
          <div class="entrada-icone">
            <wop-icone nome="pesquisar"></wop-icone>
            <input type="search" id="pesquisa" name="pesquisa" placeholder="Palavra no título, descrição ou competência" autocomplete="off">
          </div>
        </div>
        <div class="campo campo-area">
          <label for="filtroCategoria">Área</label>
          <select id="filtroCategoria" name="area"></select>
        </div>
        <div class="campo">
          <label for="filtroOrcamento">Orçamento</label>
          <select id="filtroOrcamento" name="orcamento">
            <option value="">Qualquer valor</option>
            <option value="0-500">Até 500</option>
            <option value="500-2000">500 a 2 000</option>
            <option value="2000-">Mais de 2 000</option>
          </select>
        </div>
        <div class="campo">
          <label for="ordem">Ordenar</label>
          <select id="ordem" name="ordem">
            <option value="recentes">Mais recentes</option>
            <option value="maior">Maior orçamento</option>
            <option value="prazo">Prazo mais curto</option>
          </select>
        </div>
      </form>
      <div class="atalhos-areas" id="atalhosAreas" role="group" aria-label="Filtrar por área"></div>
    </search>

    <p id="contagem" class="texto-suave texto-pequeno" aria-live="polite">A carregar projetos…</p>
    <div id="listaProjetos" class="lista-grelha">
      <div class="esqueleto"></div><div class="esqueleto"></div><div class="esqueleto"></div><div class="esqueleto"></div>
    </div>
  </main>

  <dialog id="janelaProjeto" aria-labelledby="jpTitulo"></dialog>

  <wop-rodape></wop-rodape>
</body>
</html>
