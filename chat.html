<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mensagens · Work on Pan</title>
  <link rel="icon" href="pan.png">
  <link rel="stylesheet" href="styles.css">
  <script>try{var t=localStorage.getItem("wop_tema");if(t==="claro")document.documentElement.dataset.theme="light";if(t==="escuro")document.documentElement.dataset.theme="dark"}catch(e){}</script>
</head>
<body>
  <header id="topo" class="topo"></header>

  <main class="chat-principal">
    <div class="caixa-entrada" id="caixa">
      <!-- Lista de conversas -->
      <section class="lista-conversas" aria-labelledby="tituloMensagens">
        <div class="lista-conversas-topo">
          <h1 id="tituloMensagens">Mensagens</h1>
          <label for="pesquisaConversas" class="so-leitores">Procurar conversa</label>
          <input type="search" id="pesquisaConversas" placeholder="Procurar por pessoa ou projeto">
          <div class="filtro-conversas" role="group" aria-label="Filtrar conversas">
            <button type="button" data-filtro="todas" aria-pressed="true">Todas</button>
            <button type="button" data-filtro="por-ler" aria-pressed="false">Por ler</button>
            <button type="button" data-filtro="projetos" aria-pressed="false">Sobre projetos</button>
          </div>
        </div>
        <ul class="conversas" id="listaConversas">
          <li class="vazio texto-pequeno">A carregar conversas…</li>
        </ul>
      </section>

      <!-- Conversa aberta -->
      <section class="painel-conversa" id="painelConversa" aria-live="polite">
        <div class="conversa-topo">
          <button type="button" class="voltar-lista" onclick="fecharConversa()">← Conversas</button>
          <div class="pessoa">
            <span class="avatar" id="cvAvatar" aria-hidden="true"></span>
            <div style="min-width: 0">
              <strong id="cvNome"></strong>
              <small id="cvProjeto"></small>
            </div>
          </div>
        </div>
        <div class="contexto-projeto" id="cvContexto" hidden></div>
        <div class="mensagens" id="mensagens"></div>
        <form class="escrever" id="formMensagem">
          <label for="textoMensagem" class="so-leitores">Escrever mensagem</label>
          <textarea id="textoMensagem" rows="1" maxlength="4000" placeholder="Escreve uma mensagem…"></textarea>
          <button type="submit" class="botao botao-principal">Enviar</button>
        </form>
        <p class="nota-seguranca">Enter envia · Shift+Enter muda de linha. Nunca partilhes palavras-passe nem dados bancários pelo chat.</p>
      </section>

      <div class="sem-conversa" id="semConversa">
        <div>
          <h2>Escolhe uma conversa</h2>
          <p>As conversas abrem-se quando um freelancer envia uma proposta<br>ou quando um cliente contacta um freelancer.</p>
        </div>
      </div>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
  <script>
    let conversas = [];
    let filtro = "todas";
    let conversaAtiva = new URLSearchParams(location.search).get("c");
    let pararMensagens = null;
    const projetosCache = {};

    function outraPessoa(c) {
      const id = c.participantes.find((p) => p !== wopUser.uid);
      return { id, nome: c.nomes?.[id] || c.participantesNomes?.[id] || "Utilizador" };
    }

    /* Lista */

    function desenharLista() {
      const termo = $("pesquisaConversas").value.trim().toLowerCase();
      const lista = conversas.filter((c) => {
        const texto = (outraPessoa(c).nome + " " + (c.projetoTitulo || c.projeto || "")).toLowerCase();
        if (termo && !texto.includes(termo)) return false;
        if (filtro === "por-ler") return conversaPorLer(c, wopUser.uid);
        if (filtro === "projetos") return Boolean(c.projetoId);
        return true;
      });

      const alvo = $("listaConversas");
      if (!conversas.length) {
        alvo.innerHTML = `<li class="vazio texto-pequeno">
          ${wopConta.tipo === "cliente"
            ? 'Ainda não tens conversas. Aparecem aqui quando recebes uma proposta ou contactas um freelancer em <a href="index.html#freelancers">Procurar freelancers</a>.'
            : 'Ainda não tens conversas. Envia uma proposta num <a href="projetos.html">projeto aberto</a> e a conversa com o cliente abre-se aqui.'}
        </li>`;
        return;
      }
      if (!lista.length) {
        alvo.innerHTML = `<li class="vazio texto-pequeno">Nenhuma conversa neste filtro.</li>`;
        return;
      }

      alvo.innerHTML = lista.map((c) => {
        const pessoa = outraPessoa(c);
        const porLer = conversaPorLer(c, wopUser.uid);
        const minha = c.ultimoAutor === wopUser.uid ? "Tu: " : "";
        return `
          <li class="${porLer ? "por-ler" : ""}">
            <button type="button" onclick="abrirConversa('${esc(c.id)}')" ${c.id === conversaAtiva ? 'aria-current="true"' : ""}>
              <span class="avatar" aria-hidden="true">${esc(iniciais(pessoa.nome))}</span>
              <span class="conversa-nome">${esc(pessoa.nome)}${porLer ? '<span class="so-leitores"> (por ler)</span>' : ""}</span>
              <span class="conversa-hora">${esc(horaCurta(c.ultimaMensagemHora))}</span>
              <span class="conversa-projeto">${esc(c.projetoTitulo || c.projeto || "Contacto direto")}</span>
              <span class="conversa-ultima">${esc(minha + (c.ultimaMensagem || ""))}</span>
            </button>
          </li>`;
      }).join("");
    }

    document.querySelectorAll("[data-filtro]").forEach((b) =>
      b.addEventListener("click", () => {
        filtro = b.dataset.filtro;
        document.querySelectorAll("[data-filtro]").forEach((x) => x.setAttribute("aria-pressed", x === b));
        desenharLista();
      })
    );
    $("pesquisaConversas").addEventListener("input", desenharLista);

    /* Conversa */

    function abrirConversa(id) {
      const c = conversas.find((x) => x.id === id);
      if (!c) return;
      const mudou = conversaAtiva !== id || !pararMensagens;
      conversaAtiva = id;
      history.replaceState(null, "", "chat.html?c=" + encodeURIComponent(id));
      $("caixa").classList.add("com-conversa");

      const pessoa = outraPessoa(c);
      $("cvAvatar").textContent = iniciais(pessoa.nome);
      $("cvNome").textContent = pessoa.nome;
      $("cvProjeto").textContent = c.projetoTitulo || c.projeto || "Contacto direto";
      desenharContexto(c);
      desenharLista();

      if (mudou) {
        if (pararMensagens) pararMensagens();
        $("mensagens").innerHTML = "";
        pararMensagens = db.collection("chats").doc(id).collection("mensagens")
          .orderBy("hora", "asc")
          .onSnapshot(
            (snap) => desenharMensagens(snap.docs.map((d) => d.data({ serverTimestamps: "estimate" }))),
            (e) => {
              console.error("[Work on Pan] mensagens:", e);
              $("mensagens").innerHTML = `<p class="msg sistema">Não foi possível carregar as mensagens.</p>`;
            }
          );
        $("textoMensagem").focus();
      }
      marcarComoLida(c);
    }

    // Mostra o estado do projeto por cima das mensagens (ex.: "A receber propostas").
    function desenharContexto(c) {
      const alvo = $("cvContexto");
      if (!c.projetoId) return (alvo.hidden = true);
      const mostrar = (p) => {
        if (conversaAtiva !== c.id) return;
        if (!p) {
          alvo.textContent = "Este projeto já foi apagado pelo cliente.";
        } else {
          const orcamento = p.orcamento ?? p.budget;
          alvo.innerHTML = `${etiqueta(ESTADOS_PROJETO, p.estado)} Orçamento ${esc(dinheiro(orcamento, p.moeda))} · ${esc(p.prazoDias || "?")} dias ·
            <a href="index.html">${wopConta.tipo === "cliente" ? "ver propostas" : "ver a minha proposta"}</a>`;
        }
        alvo.hidden = false;
      };
      if (c.projetoId in projetosCache) return mostrar(projetosCache[c.projetoId]);
      db.collection("projetos").doc(c.projetoId).get()
        .then((d) => mostrar((projetosCache[c.projetoId] = d.exists ? d.data() : null)))
        .catch(() => (alvo.hidden = true));
    }

    function desenharMensagens(msgs) {
      const caixa = $("mensagens");
      const noFundo = caixa.scrollHeight - caixa.scrollTop - caixa.clientHeight < 80;
      caixa.innerHTML = msgs.map((m) => {
        const classe = m.autor === "sistema" ? "sistema" : m.autor === wopUser.uid ? "minha" : "outra";
        const hora = m.hora ? `<time>${esc(horaCurta(m.hora))}</time>` : "";
        return `<div class="msg ${classe}">${esc(m.texto)}${classe === "sistema" ? "" : hora}</div>`;
      }).join("");
      if (noFundo || msgs.length < 20) caixa.scrollTop = caixa.scrollHeight;
      const c = conversas.find((x) => x.id === conversaAtiva);
      if (c) marcarComoLida(c);
    }

    const marcadasHaPouco = {};
    function marcarComoLida(c) {
      if (!conversaPorLer(c, wopUser.uid) || document.hidden) return;
      if (Date.now() - (marcadasHaPouco[c.id] || 0) < 3000) return;
      marcadasHaPouco[c.id] = Date.now();
      db.collection("chats").doc(c.id).update({ ["lidoEm." + wopUser.uid]: agora() }).catch(() => {});
    }

    function fecharConversa() {
      if (pararMensagens) pararMensagens();
      pararMensagens = null;
      conversaAtiva = null;
      history.replaceState(null, "", "chat.html");
      $("caixa").classList.remove("com-conversa");
      desenharLista();
    }

    /* Escrever */

    const campo = $("textoMensagem");
    campo.addEventListener("input", () => {
      campo.style.height = "auto";
      campo.style.height = Math.min(campo.scrollHeight, 160) + "px";
    });
    campo.addEventListener("keydown", (ev) => {
      if (ev.key === "Enter" && !ev.shiftKey) {
        ev.preventDefault();
        $("formMensagem").requestSubmit();
      }
    });

    $("formMensagem").addEventListener("submit", (ev) => {
      ev.preventDefault();
      const texto = campo.value.trim();
      if (!texto || !conversaAtiva) return;
      campo.value = "";
      campo.style.height = "auto";
      enviarMensagem(conversaAtiva, texto).catch((e) => {
        campo.value = texto;
        avisar("A mensagem não foi enviada. " + traduzirErro(e), "erro");
      });
    });

    document.addEventListener("visibilitychange", () => {
      const c = conversas.find((x) => x.id === conversaAtiva);
      if (c && !document.hidden) marcarComoLida(c);
    });

    /* Arranque */

    exigirSessao((user) => {
      // Sem orderBy para não depender de índice composto; ordena-se aqui.
      db.collection("chats").where("participantes", "array-contains", user.uid).onSnapshot(
        (snap) => {
          conversas = ordenarPorData(
            snap.docs.map((d) => ({ id: d.id, ...d.data({ serverTimestamps: "estimate" }) })),
            "ultimaMensagemHora"
          );
          desenharLista();
          if (conversaAtiva) {
            if (conversas.some((c) => c.id === conversaAtiva)) abrirConversa(conversaAtiva);
            else if (!snap.metadata.fromCache) fecharConversa();
          }
        },
        (e) => {
          console.error("[Work on Pan] conversas:", e);
          $("listaConversas").innerHTML = `<li class="vazio texto-pequeno">Não foi possível carregar as conversas. ${esc(traduzirErro(e))}</li>`;
        }
      );
    });
  </script>
</body>
</html>
