<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mensagens · Work on Pan</title>
  <link rel="icon" href="pan.png">
  <link rel="stylesheet" href="styles.css">
  <script>try{var t=localStorage.getItem("wop_tema");if(t==="claro")document.documentElement.dataset.theme="light";if(t==="escuro")document.documentElement.dataset.theme="dark"}catch(e){}</script>
</head>
<body>
  <header id="topo" class="topo"></header>

  <main class="chat-principal">
    <div class="caixa-entrada" id="caixa">
      <!-- Lista de conversas -->
      <section class="lista-conversas" aria-labelledby="tituloMensagens">
        <div class="lista-conversas-topo">
          <h1 id="tituloMensagens">Mensagens</h1>
          <label for="pesquisaConversas" class="so-leitores">Procurar conversa</label>
          <input type="search" id="pesquisaConversas" placeholder="Procurar por pessoa ou projeto">
          <div class="filtro-conversas" role="group" aria-label="Filtrar conversas">
            <button type="button" data-filtro="todas" aria-pressed="true">Todas</button>
            <button type="button" data-filtro="por-ler" aria-pressed="false">Por ler</button>
            <button type="button" data-filtro="projetos" aria-pressed="false">Sobre projetos</button>
          </div>
        </div>
        <ul class="conversas" id="listaConversas">
          <li class="vazio texto-pequeno">A carregar conversas…</li>
        </ul>
      </section>

      <!-- Conversa aberta -->
      <section class="painel-conversa" id="painelConversa" aria-live="polite">
        <div class="conversa-topo">
          <button type="button" class="voltar-lista" onclick="fecharConversa()">← Conversas</button>
          <div class="pessoa">
            <span class="avatar" id="cvAvatar" aria-hidden="true"></span>
            <div style="min-width: 0">
              <strong id="cvNome"></strong>
              <small id="cvProjeto"></small>
            </div>
          </div>
        </div>
        <div class="contexto-projeto" id="cvContexto" hidden></div>
        <div class="mensagens" id="mensagens"></div>
        <form class="escrever" id="formMensagem">
          <label for="textoMensagem" class="so-leitores">Escrever mensagem</label>
          <textarea id="textoMensagem" rows="1" maxlength="4000" placeholder="Escreve uma mensagem…"></textarea>
          <button type="submit" class="botao botao-principal">Enviar</button>
        </form>
        <p class="nota-seguranca">Enter envia · Shift+Enter muda de linha. Nunca partilhes palavras-passe nem dados bancários pelo chat.</p>
      </section>

      <div class="sem-conversa" id="semConversa">
        <div>
          <h2>Escolhe uma conversa</h2>
          <p>As conversas abrem-se quando um freelancer envia uma proposta<br>ou quando um cliente contacta um freelancer.</p>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
  <script src="supabase-config.js"></script>
  <script src="app.js"></script>
  <script>
    let conversas = [];
    let filtro = "todas";
    let conversaAtiva = new URLSearchParams(location.search).get("c");
    let canalMensagens = null;
    let mensagens = [];

    const CAMPOS_CONVERSA = `*,
      cliente:perfis!conversas_cliente_id_fkey(nome, sobrenome, empresa),
      freelancer:perfis!conversas_freelancer_id_fkey(nome, sobrenome),
      projeto:projetos(id, titulo, estado, orcamento, moeda, prazo_dias)`;

    function outraPessoa(c) {
      return c.cliente_id === wopUser.id ? nomeCompleto(c.freelancer) : nomeCliente(c.cliente);
    }

    /* Lista */

    async function carregarConversas() {
      const { data, error } = await sb.from("conversas").select(CAMPOS_CONVERSA).order("ultima_mensagem_em", { ascending: false });
      if (error) {
        console.error("[Work on Pan] conversas:", error);
        $("listaConversas").innerHTML = `<li class="vazio texto-pequeno">Não foi possível carregar as conversas. ${esc(traduzirErro(error))}</li>`;
        return;
      }
      conversas = data;
      desenharLista();
      if (conversaAtiva) {
        if (conversas.some((c) => c.id === conversaAtiva)) abrirConversa(conversaAtiva);
        else fecharConversa();
      }
    }

    function desenharLista() {
      const termo = $("pesquisaConversas").value.trim().toLowerCase();
      const lista = conversas.filter((c) => {
        const texto = (outraPessoa(c) + " " + (c.projeto?.titulo || "")).toLowerCase();
        if (termo && !texto.includes(termo)) return false;
        if (filtro === "por-ler") return conversaPorLer(c, wopUser.id);
        if (filtro === "projetos") return Boolean(c.projeto_id);
        return true;
      });

      const alvo = $("listaConversas");
      if (!conversas.length) {
        alvo.innerHTML = `<li class="vazio texto-pequeno">
          ${wopPerfil.tipo === "cliente"
            ? 'Ainda não tens conversas. Aparecem aqui quando recebes uma proposta ou contactas um freelancer em <a href="index.html#freelancers">Procurar freelancers</a>.'
            : 'Ainda não tens conversas. Envia uma proposta num <a href="projetos.html">projeto aberto</a> e a conversa com o cliente abre-se aqui.'}
        </li>`;
        return;
      }
      if (!lista.length) {
        alvo.innerHTML = `<li class="vazio texto-pequeno">Nenhuma conversa neste filtro.</li>`;
        return;
      }

      alvo.innerHTML = lista.map((c) => {
        const nome = outraPessoa(c);
        const porLer = conversaPorLer(c, wopUser.id);
        const minha = c.ultimo_autor_id === wopUser.id ? "Tu: " : "";
        return `
          <li class="${porLer ? "por-ler" : ""}">
            <button type="button" onclick="abrirConversa('${esc(c.id)}')" ${c.id === conversaAtiva ? 'aria-current="true"' : ""}>
              <span class="avatar" aria-hidden="true">${esc(iniciais(nome))}</span>
              <span class="conversa-nome">${esc(nome)}${porLer ? '<span class="so-leitores"> (por ler)</span>' : ""}</span>
              <span class="conversa-hora">${esc(horaCurta(c.ultima_mensagem_em))}</span>
              <span class="conversa-projeto">${esc(c.projeto?.titulo || "Contacto direto")}</span>
              <span class="conversa-ultima">${esc(minha + c.ultima_mensagem)}</span>
            </button>
          </li>`;
      }).join("");
    }

    document.querySelectorAll("[data-filtro]").forEach((b) =>
      b.addEventListener("click", () => {
        filtro = b.dataset.filtro;
        document.querySelectorAll("[data-filtro]").forEach((x) => x.setAttribute("aria-pressed", x === b));
        desenharLista();
      })
    );
    $("pesquisaConversas").addEventListener("input", desenharLista);

    /* Conversa */

    async function abrirConversa(id) {
      const c = conversas.find((x) => x.id === id);
      if (!c) return;
      const mudou = conversaAtiva !== id || !canalMensagens;
      conversaAtiva = id;
      history.replaceState(null, "", "chat.html?c=" + encodeURIComponent(id));
      $("caixa").classList.add("com-conversa");

      const nome = outraPessoa(c);
      $("cvAvatar").textContent = iniciais(nome);
      $("cvNome").textContent = nome;
      $("cvProjeto").textContent = c.projeto?.titulo || "Contacto direto";
      desenharContexto(c);
      desenharLista();
      marcarComoLida(c);

      if (!mudou) return;
      if (canalMensagens) sb.removeChannel(canalMensagens);
      mensagens = [];
      $("mensagens").innerHTML = "";

      // Mensagens novas chegam em tempo real; a lista inicial vem de uma consulta.
      canalMensagens = sb
        .channel("mensagens-" + id)
        .on("postgres_changes", { event: "INSERT", schema: "public", table: "mensagens", filter: `conversa_id=eq.${id}` },
          ({ new: m }) => {
            if (m.conversa_id !== conversaAtiva || mensagens.some((x) => x.id === m.id)) return;
            mensagens.push(m);
            desenharMensagens();
          })
        .subscribe();

      const { data, error } = await sb.from("mensagens").select("*").eq("conversa_id", id).order("criado_em");
      if (conversaAtiva !== id) return;
      if (error) {
        $("mensagens").innerHTML = `<p class="msg sistema">Não foi possível carregar as mensagens.</p>`;
        return;
      }
      const vistas = new Set(data.map((m) => m.id));
      mensagens = [...data, ...mensagens.filter((m) => !vistas.has(m.id))];
      desenharMensagens(true);
      $("textoMensagem").focus();
    }

    // Mostra o estado do projeto por cima das mensagens (ex.: «A receber propostas»).
    function desenharContexto(c) {
      const alvo = $("cvContexto");
      if (!c.projeto) return (alvo.hidden = true);
      const p = c.projeto;
      alvo.innerHTML = `${etiqueta(ESTADOS_PROJETO, p.estado)} Orçamento ${esc(dinheiro(p.orcamento, p.moeda))} · ${esc(p.prazo_dias)} dias ·
        <a href="index.html">${wopPerfil.tipo === "cliente" ? "ver propostas" : "ver a minha proposta"}</a>`;
      alvo.hidden = false;
    }

    function desenharMensagens(forcarFundo = false) {
      const caixa = $("mensagens");
      const noFundo = forcarFundo || caixa.scrollHeight - caixa.scrollTop - caixa.clientHeight < 80;
      caixa.innerHTML = mensagens.map((m) => {
        const classe = m.autor_id === null ? "sistema" : m.autor_id === wopUser.id ? "minha" : "outra";
        const hora = classe === "sistema" ? "" : `<time>${esc(horaCurta(m.criado_em))}</time>`;
        return `<div class="msg ${classe}">${esc(m.texto)}${hora}</div>`;
      }).join("");
      if (noFundo) caixa.scrollTop = caixa.scrollHeight;
    }

    let ultimaMarcacao = 0;
    function marcarComoLida(c) {
      if (!conversaPorLer(c, wopUser.id) || document.hidden) return;
      if (Date.now() - ultimaMarcacao < 2000) return;
      ultimaMarcacao = Date.now();
      sb.rpc("marcar_conversa_lida", { p_conversa: c.id }).then(atualizarContadorMensagens);
    }

    function fecharConversa() {
      if (canalMensagens) sb.removeChannel(canalMensagens);
      canalMensagens = null;
      conversaAtiva = null;
      history.replaceState(null, "", "chat.html");
      $("caixa").classList.remove("com-conversa");
      desenharLista();
    }

    /* Escrever */

    const campo = $("textoMensagem");
    campo.addEventListener("input", () => {
      campo.style.height = "auto";
      campo.style.height = Math.min(campo.scrollHeight, 160) + "px";
    });
    campo.addEventListener("keydown", (ev) => {
      if (ev.key === "Enter" && !ev.shiftKey) {
        ev.preventDefault();
        $("formMensagem").requestSubmit();
      }
    });

    $("formMensagem").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const texto = campo.value.trim();
      if (!texto || !conversaAtiva) return;
      campo.value = "";
      campo.style.height = "auto";
      const { data, error } = await sb
        .from("mensagens")
        .insert({ conversa_id: conversaAtiva, autor_id: wopUser.id, texto })
        .select()
        .single();
      if (error) {
        campo.value = texto;
        return avisar("A mensagem não foi enviada. " + traduzirErro(error), "erro");
      }
      if (!mensagens.some((m) => m.id === data.id)) mensagens.push(data);
      desenharMensagens(true);
    });

    document.addEventListener("visibilitychange", () => {
      const c = conversas.find((x) => x.id === conversaAtiva);
      if (c && !document.hidden) marcarComoLida(c);
    });

    /* Arranque */

    exigirSessao(() => {
      carregarConversas();
      aoMudar(["conversas"], carregarConversas);
    });
  </script>
</body>
</html>
