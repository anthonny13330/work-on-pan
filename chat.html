<!DOCTYPE html><html lang="pt-PT"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mensagens — Work on Pan</title><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"><style>*,::after,::before{box-sizing:border-box;margin:0;padding:0}:root{--bg:#0a0f0d;--teal:#2abfaa;--teal-dim:rgba(42,191,170,0.12);--white:#f0f5f3;--gray:rgba(240,245,243,0.5);--gray2:rgba(240,245,243,0.25);--card-bg:rgba(255,255,255,0.04);--card-border:rgba(42,191,170,0.15);--radius:14px}html[data-theme=light]{--bg:#f4f7f6;--white:#0a0f0d;--gray:rgba(10,15,13,0.55);--gray2:rgba(10,15,13,0.32);--card-bg:rgba(10,15,13,0.03);--card-border:rgba(42,191,170,0.28);--teal-dim:rgba(42,191,170,0.10)}body,html{min-height:100%;background:var(--bg);color:var(--white);font-family:'DM Sans',sans-serif}.navbar{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:14px 5%;background:rgba(10,15,13,.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--card-border)}html[data-theme=light] .navbar{background:rgba(244,247,246,.9)}.logo{font-family:'Playfair Display',serif;font-size:1.2rem;font-weight:900;color:var(--white);text-decoration:none}.logo span{color:var(--teal);font-style:italic}.btn-back{background:0 0;border:none;color:var(--gray);font-family:'DM Sans',sans-serif;font-size:.88rem;cursor:pointer}.btn-back:hover{color:var(--white)}.safety-banner{display:flex;align-items:center;gap:10px;background:var(--teal-dim);border-bottom:1px solid var(--card-border);color:var(--teal);font-size:.82rem;padding:10px 5%;text-align:center;justify-content:center}.layout{display:grid;grid-template-columns:300px 1fr;height:calc(100vh - 96px)}.conv-list{border-right:1px solid var(--card-border);overflow-y:auto;padding:10px}.conv-item{display:flex;flex-direction:column;gap:3px;padding:12px 14px;border-radius:10px;cursor:pointer;margin-bottom:4px}.conv-item:hover{background:var(--card-bg)}.conv-item.active{background:var(--teal-dim)}.conv-item strong{font-size:.9rem}.conv-item span{font-size:.76rem;color:var(--gray)}.empty-conv{padding:30px 16px;color:var(--gray);font-size:.85rem;text-align:center}.chat-pane{display:flex;flex-direction:column;height:100%}.chat-head{padding:16px 22px;border-bottom:1px solid var(--card-border)}.chat-head strong{display:block;font-size:1rem}.chat-head span{font-size:.78rem;color:var(--gray)}.msgs{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:10px}.msg{max-width:60%;padding:10px 14px;border-radius:12px;font-size:.88rem;line-height:1.4}.msg.eu{align-self:flex-end;background:var(--teal);color:#06110d;border-bottom-right-radius:3px}.msg.contraparte{align-self:flex-start;background:var(--card-bg);border:1px solid var(--card-border);border-bottom-left-radius:3px}.msg.sistema{align-self:center;max-width:80%;background:var(--teal-dim);color:var(--teal);border-radius:10px;font-size:.8rem;text-align:center}.composer{display:flex;gap:10px;padding:14px 20px;border-top:1px solid var(--card-border)}.composer input{flex:1;background:var(--card-bg);border:1.5px solid var(--card-border);border-radius:10px;padding:11px 14px;color:var(--white);font-family:'DM Sans',sans-serif;font-size:.9rem}.composer input:focus{outline:0;border-color:var(--teal)}.composer button{background:var(--teal);border:none;border-radius:10px;padding:0 18px;color:#06110d;font-weight:500;cursor:pointer}.placeholder-pane{display:flex;align-items:center;justify-content:center;height:100%;color:var(--gray);font-size:.9rem}@media(max-width:700px){.layout{grid-template-columns:1fr}.conv-list{display:none}}</style></head><body><nav class="navbar"><a href="index.html" class="logo">Work <span>on Pan</span></a> <button class="btn-back" onclick='window.location.href="index.html"' data-i18n="nav.back">Voltar à plataforma</button></nav><div class="safety-banner">🛡 <span data-i18n="chat.safety">Mantém sempre a conversa e os pagamentos dentro do Work on Pan.</span></div><div class="layout"><aside class="conv-list" id="convList"></aside><main class="chat-pane" id="chatPane"><div class="placeholder-pane" id="chatPlaceholder" data-i18n="chat.select">Seleciona uma conversa para começar.</div></main></div><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script><script src="auth-guard.js"></script><script src="i18n.js"></script><script src="theme.js"></script><script src="chat.js"></script><script>let matchAtivo=new URLSearchParams(window.location.search).get("m"),chatsCache=[],unsubMensagens=null;function renderLista(n){chatsCache=n;document.getElementById("convList").innerHTML=n.length?n.map(n=>`<div class="conv-item ${n.id===matchAtivo?"active":""}" onclick="abrirConversa('${n.id}')">\n          <strong>${n.contraparte}</strong>\n          <span>${n.projeto}</span>\n        </div>`).join(""):`<div class="empty-conv">${T("chat.noConversations")}</div>`}function abrirConversa(n){matchAtivo=n,history.replaceState(null,"",`chat.html?m=${n}`),renderLista(chatsCache),renderConversaHead(),unsubMensagens&&unsubMensagens(),unsubMensagens=escutarMensagens(n,renderMensagens)}function renderConversaHead(){const n=chatsCache.find(n=>n.id===matchAtivo),e=document.getElementById("chatPane");e.innerHTML=n?`\n      <div class="chat-head"><strong>${n.contraparte}</strong><span>${n.projeto}</span></div>\n      <div class="msgs" id="msgsBox"></div>\n      <div class="composer">\n        <input id="msgInput" placeholder="${T("chat.placeholder")}" onkeydown="if(event.key==='Enter')enviar()"/>\n        <button onclick="enviar()">${T("btn.send")}</button>\n      </div>`:`<div class="placeholder-pane">${T("chat.select")}</div>`}function renderMensagens(n){const e=document.getElementById("msgsBox");e&&(e.innerHTML=n.map(n=>`<div class="msg ${n.autor}">${n.texto}</div>`).join(""),e.scrollTop=e.scrollHeight)}function enviar(){const n=document.getElementById("msgInput");n.value.trim()&&(enviarMensagem(matchAtivo,n.value),n.value="")}wopRequireAuth(function(){escutarChats(n=>{renderLista(n),matchAtivo&&(renderConversaHead(),unsubMensagens||(unsubMensagens=escutarMensagens(matchAtivo,renderMensagens)))})})</script></body></html>
